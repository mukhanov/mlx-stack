[project]
name = "local-llm"
dynamic = ["version"]
description = "MLX Stack backend: a local model served over OpenAI and Anthropic APIs on localhost"
readme = {text = "MLX Stack backend: MLX or llama.cpp serving sized for your RAM, OpenAI and Anthropic APIs on localhost, client config for pi / omp / opencode / Claude Code. https://github.com/mukhanov/mlx-stack", content-type = "text/plain"}
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # MLX server (OpenAI API) — pulls in mlx/mlx-metal for the current chip
    "mlx-lm>=0.25",
    # snapshot_download, HF API; targets the hub 1.x cache layout. transformers
    # 5.x already forbids 2.x (httpx2 rewrite); the cap keeps it explicit if
    # that ever changes — hf.py scans blobs/ and .incomplete files directly.
    "huggingface-hub>=1.0,<2.0",
    # the app's Monitor, sampled once a second: per-core CPU load and
    # per-process CPU time — mach calls the standard library doesn't expose
    "psutil>=5.9",
]

[project.scripts]
local-llm = "local_llm.cli:main"

[project.urls]
Homepage = "https://github.com/mukhanov/mlx-stack"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "local_llm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["local_llm"]

